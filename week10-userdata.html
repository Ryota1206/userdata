<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>GitHub User</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 p-8">
    <h1 class="text-2xl font-bold mb-6">GitHubユーザー登録</h1>
    <input
    id="usernameInput"
    type="text"
    placeholder="GitHubユーザー名を入力"
    class="border p-2 rounded w-64">
  <button
  id="searchBtn"
  class="ml-2 bg-blue-500 text-white px-4 py-2 rounded"
  >検索</button>
  <div id="userResult" class="mt-6"></div>
  <script>
    async function fetchUser(){
      const username=document.getElementById("usernameInput").value;
      const userResult=document.getElementById("userResult");
      if (!username){
        userResult.textContent="ユーザー名を入力してください";
        return;
      }
      try{
        const response=await fetch(`https://api.github.com/users/${username}`);
        if(!response.ok){
          userResult.textContent="ユーザーが見つかりませんでした";
          return;
        }
        const user=await response.json();
        console.log(user);
        userResult.textContent="";
        const card=document.createElement("div");
        card.className="bg-white rounded-lg shadow p-6 w-80";

        const avatar =document.createElement("img");
        avatar.src =user.avatar_url;
        avatar.className="w-24 h-24 rounded-full mx-auto";

        const name =document.createElement("h2");
        name.className="text-xl font-bold text-center mt-4";
        name.textContent=user.name||"名前なし";

        const bio =document.createElement("p");
        bio.className="text-gray-700 text-center mt-2";
        bio.textContent=user.bio||"自己紹介なし";
        const followers =document.createElement("p");
        followers.className ="text-gray-600 text-center mt-2";
        followers.textContent=`フォロワー：${user.followers}`;

        card.appendChild(avatar);
        card.appendChild(name);
        card.appendChild(bio);
        card.appendChild(followers);

        userResult.appendChild(card);
      } catch(error){
        userResult.textContent ="通信エラーが発生しました";
        console.error(error);

      }
            }

            document.getElementById("searchBtn").addEventListener("click",fetchUser);

    
  </script>
  </body>
</html>
